[project]
name = "reduced-ctm-aqms"
version = "0.1.0"
description = "Reduced Eulerian CTM with adjoint inverse source estimation and co-kriging spatial interpolation for urban AQMS"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "jsonschema>=4.17"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
